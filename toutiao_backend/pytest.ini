[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# 自定义标记：每个用例可按粒度选择执行
markers =
    asyncio: 异步测试（pytest-asyncio）
    api: API 接口测试（新闻 / AI / 用户）
    rag: RAG 质量测试（检索精度 / 幻觉 / 多轮）
    data: 数据一致性测试（MySQL + Chroma 双存储）
    performance: 性能测试（缓存命中率 / JMeter 基线指标）
    slow: 慢速测试（耗时 > 5s，可 -m "not slow" 跳过）
    smoke: 冒烟测试（上线前快速回归用的核心用例）

# 默认选项：详细 + 短回溯 + 严格标记 + 禁用警告 + Allure 结果目录
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --alluredir=test_reports/allure-results
